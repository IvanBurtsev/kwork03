{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <div style="font-size:3rem">👤</div>
      <h2>Личный кабинет</h2>
      <p class="text-muted small">Войдите или <a href="/register">зарегистрируйтесь</a></p>
    </div>
    {% if error %}<div class="alert alert-danger">{{ error|e }}</div>{% endif %}
    <div class="card"><div class="card-body">
      <form action="/login" method="post">
        <div class="mb-3"><label class="form-label">Имя</label><input type="text" name="username" class="form-control" required autofocus></div>
        <div class="mb-3"><label class="form-label">Пароль</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn btn-primary w-100">Войти</button>
      </form>
    </div></div>
    <p class="text-center mt-3"><a href="/register">Регистрация</a></p>
  </div>
</div>
{% endblock %}
