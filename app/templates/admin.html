{% extends "base.html" %}
{% block title %}Админ{% endblock %}
{% block content %}

<h1>⚙️ Админ-панель</h1>

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead>
        <tr><th>ID</th><th>Имя</th><th>Админ</th><th>Активен</th><th></th></tr>
      </thead>
      <tbody>
        {% for u in users %}
        <tr>
          <td>{{ u.id }}</td>
          <td>{{ u.username|e }}</td>
          <td>{% if u.is_admin %}✅{% endif %}</td>
          <td>{% if u.is_active %}<span class="badge bg-success text-white">Активен</span>{% else %}<span class="badge bg-danger text-white">Блок</span>{% endif %}</td>
          <td>
            <form action="/admin/user/{{ u.id }}/toggle" method="post" style="display:inline">
              <button type="submit" class="btn btn-sm btn-outline-secondary">{% if u.is_active %}Заблокировать{% else %}Разблокировать{% endif %}</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
