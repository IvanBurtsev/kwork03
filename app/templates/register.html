{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <div style="font-size:3rem">👤</div>
      <h2>Регистрация</h2>
    </div>
    {% if error %}<div class="alert alert-danger">{{ error|e }}</div>{% endif %}
    <div class="card"><div class="card-body">
      <form action="/register" method="post">
        <div class="mb-3"><label class="form-label">Имя</label><input type="text" name="username" class="form-control" required minlength="3"></div>
        <div class="mb-3"><label class="form-label">Пароль</label><input type="password" name="password" class="form-control" required minlength="4"></div>
        <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
      </form>
    </div></div>
    <p class="text-center mt-3"><a href="/login">Уже есть аккаунт?</a></p>
  </div>
</div>
{% endblock %}
